# 本機開發用 MySQL。版本刻意鎖 8.0 以對齊 AWS RDS 的目標版本。
# 埠號用 3307，避免與本機既有的 Homebrew MySQL（3306）衝突。
services:
  mysql:
    image: mysql:8.0
    container_name: remockable-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: remockable
      MYSQL_USER: remockable
      MYSQL_PASSWORD: remockable
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - remockable-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  remockable-mysql-data:
